<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updating Our Interface | 2 Hearts 4 Paws Refuge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            overflow: hidden;
        }

        .floating-paw {
            position: absolute;
            color: rgba(244, 63, 94, 0.05);
            z-index: -1;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100px) rotate(360deg); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05);
        }

        .gradient-text {
            background: linear-gradient(135deg, #f43f5e, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-bar {
            width: 0%;
            transition: width 2s ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Animated Background Paws -->
    <div id="paws-container"></div>

    <main class="max-w-2xl w-full text-center animate__animated animate__fadeIn">
        <div class="glass-card rounded-[2.5rem] p-8 md:p-16 relative overflow-hidden">
            <!-- Decorative Elements -->
            <div class="absolute top-0 left-0 w-32 h-32 bg-rose-100/50 rounded-full -translate-x-16 -translate-y-16 blur-3xl"></div>
            
            <div class="relative z-10">
                <!-- Icon -->
                <div class="w-24 h-24 bg-rose-50 rounded-3xl flex items-center justify-center mx-auto mb-8 animate__animated animate__pulse animate__infinite">
                    <i data-lucide="wrench" class="w-12 h-12 text-rose-500"></i>
                </div>

                <!-- Content -->
                <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-6">
                    Improving Our <span class="gradient-text">Refuge</span>
                </h1>
                
                <p class="text-lg text-slate-600 mb-8 leading-relaxed">
                    We're currently updating our interface to give you and our furry friends a better experience. We'll be back shortly with a brand-new look!
                </p>

                <!-- Progress Section -->
                <div class="mb-10">
                    <div class="flex justify-between mb-2 text-sm font-bold text-slate-500">
                        <span>Update Progress</span>
                        <span id="progress-text">85%</span>
                    </div>
                    <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-gradient-to-r from-rose-500 to-orange-400 progress-bar" style="width: 85%;"></div>
                    </div>
                </div>

                <!-- CTA Section -->
                <div class="space-y-6">
                    <p class="text-sm font-semibold text-slate-400 uppercase tracking-widest">Notify me when we're live</p>
                    <form id="notify-form" class="flex flex-col sm:flex-row gap-3">
                        <input type="email" required placeholder="Enter your email address" class="flex-1 px-6 py-4 rounded-2xl border border-slate-200 outline-none focus:ring-2 focus:ring-rose-500 transition">
                        <button type="submit" class="px-8 py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-rose-500 transition shadow-lg">
                            Notify Me
                        </button>
                    </form>
                </div>

                <!-- Footer Links -->
                <div class="mt-12 pt-8 border-t border-slate-100 flex flex-wrap justify-center gap-6">
                    <a href="mailto:contact@2hearts4pawsrefuge.com" class="flex items-center gap-2 text-slate-500 hover:text-rose-500 transition font-medium">
                        <i data-lucide="mail" class="w-4 h-4"></i> Support
                    </a>
                    <div class="flex gap-4">
                        <a href="#" class="text-slate-400 hover:text-rose-500 transition"><i data-lucide="facebook" class="w-5 h-5"></i></a>
                        <a href="#" class="text-slate-400 hover:text-rose-500 transition"><i data-lucide="instagram" class="w-5 h-5"></i></a>
                    </div>
                </div>
            </div>
        </div>

        <p class="mt-8 text-slate-400 text-sm font-medium">
            &copy; 2024 2 Hearts 4 Paws Refuge. Thank you for your patience.
        </p>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Generate Floating Paws
        const container = document.getElementById('paws-container');
        const pawIcons = ['heart', 'dog', 'cat'];
        
        for (let i = 0; i < 15; i++) {
            const icon = document.createElement('div');
            icon.className = 'floating-paw';
            icon.style.left = Math.random() * 100 + 'vw';
            icon.style.animationDelay = Math.random() * 20 + 's';
            icon.style.fontSize = (Math.random() * 20 + 20) + 'px';
            
            const randomIcon = pawIcons[Math.floor(Math.random() * pawIcons.length)];
            icon.innerHTML = `<i data-lucide="${randomIcon}"></i>`;
            container.appendChild(icon);
        }
        lucide.createIcons();

        // Notify Form Logic
        document.getElementById('notify-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const input = e.target.querySelector('input');
            
            btn.innerHTML = '<i data-lucide="check" class="w-5 h-5 mx-auto"></i>';
            btn.classList.replace('bg-slate-900', 'bg-green-500');
            input.disabled = true;
            lucide.createIcons();
            
            setTimeout(() => {
                alert("Thank you! We'll send you an update as soon as we're back.");
            }, 500);
        });
    </script>
</body>
</html>
